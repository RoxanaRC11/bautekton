<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de Usuario</title><link th:href="@{/lib/bootstrap/css/bootstrap.min.css}" rel="stylesheet"></head><body><div class="container" style="padding-top:30px"><h2 th:text="${Titulo}">Detalle de Usuario</h2><table class="table table-bordered"><tr><th>ID</th><td th:text="${usuario.id_usuario}"></td></tr><tr><th>Nombre</th><td th:text="${usuario.nombre}"></td></tr><tr><th>Email</th><td th:text="${usuario.email}"></td></tr><tr><th>Estado</th><td th:text="${usuario.estado}"></td></tr><tr><th>Condición</th><td th:text="${usuario._condicion}"></td></tr><tr><th>Registro</th><td th:text="${usuario.fechaRegistro}"></td></tr><tr><th>Actualización</th><td th:text="${usuario.fechaActualizacion}"></td></tr></table><a class="btn btn-primary" th:href="@{/usuario/editar/{id}(id=${usuario.id_usuario})}">Editar</a> <a class="btn btn-default" th:href="@{/usuario/listar}">Volver</a></div></body></html>
