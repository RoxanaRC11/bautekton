<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de Galería</title><link th:href="@{/lib/bootstrap/css/bootstrap.min.css}" rel="stylesheet"></head><body><div class="container" style="padding-top:30px"><h2 th:text="${Titulo}">Detalle</h2><table class="table table-bordered"><tr><th>ID</th><td th:text="${galeria.id_archivo}"></td></tr><tr><th>Nombre</th><td th:text="${galeria.nombre}"></td></tr><tr><th>Descripción</th><td th:text="${galeria.descripcion}"></td></tr><tr><th>Tipo</th><td th:text="${galeria.tipo}"></td></tr><tr><th>Ruta</th><td th:text="${galeria.ruta}"></td></tr><tr><th>Creación</th><td th:text="${galeria.fechaCreacion}"></td></tr><tr><th>Modificación</th><td th:text="${galeria.fechaModificacion}"></td></tr></table><a class="btn btn-default" th:href="@{/principal}">Inicio</a></div></body></html>
