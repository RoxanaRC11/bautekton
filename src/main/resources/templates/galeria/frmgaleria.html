<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${Titulo}">Galería</title><link th:href="@{/lib/bootstrap/css/bootstrap.min.css}" rel="stylesheet"></head>
<body><div class="container" style="padding-top:30px; max-width:850px">
<h2 th:text="${Titulo}">Galería</h2>
<form th:object="${galeria}" method="post" th:action="${accion == 'actualizar'} ? @{/galeria/actualizar/{id}(id=${galeria.id_archivo})} : @{/galeria/guardar}">
<input type="hidden" th:field="*{id_archivo}">
<div class="form-group"><label>Nombre</label><input class="form-control" type="text" th:field="*{nombre}" required></div>
<div class="form-group"><label>Descripción</label><textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea></div>
<div class="row"><div class="col-md-6"><div class="form-group"><label>Tipo</label><input class="form-control" type="text" th:field="*{tipo}" placeholder="Imagen / Video"></div></div><div class="col-md-6"><div class="form-group"><label>Ruta</label><input class="form-control" type="text" th:field="*{ruta}" required></div></div></div>
<div class="row"><div class="col-md-6"><div class="form-group"><label>Fecha creación</label><input class="form-control" type="date" th:field="*{fechaCreacion}"></div></div><div class="col-md-6"><div class="form-group"><label>Fecha modificación</label><input class="form-control" type="date" th:field="*{fechaModificacion}" readonly></div></div></div>
<div class="form-group"><label>Condición</label><select class="form-control" th:field="*{_condicion}"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
<button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-default" th:href="@{/galeria/listar}">Cancelar</a>
</form></div></body></html>
