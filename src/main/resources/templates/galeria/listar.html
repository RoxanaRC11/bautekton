<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${Titulo}">Galería</title><link th:href="@{/lib/bootstrap/css/bootstrap.min.css}" rel="stylesheet"></head><body><div class="container" style="padding-top:30px">
<div class="clearfix"><h2 class="pull-left" th:text="${Titulo}">Galería</h2><a class="btn btn-primary pull-right" th:href="@{/galeria/nuevo}">Nuevo archivo</a></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
<div class="table-responsive"><table class="table table-bordered table-striped"><thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Ruta</th><th>Creación</th><th>Modificación</th><th>Condición</th><th>Acciones</th></tr></thead><tbody><tr th:each="g : ${galerias}"><td th:text="${g.id_archivo}"></td><td th:text="${g.nombre}"></td><td th:text="${g.tipo}"></td><td th:text="${g.ruta}"></td><td th:text="${g.fechaCreacion}"></td><td th:text="${g.fechaModificacion}"></td><td th:text="${g._condicion}"></td><td><a class="btn btn-xs btn-info" th:href="@{/galeria/ver/{id}(id=${g.id_archivo})}">Ver</a> <a class="btn btn-xs btn-warning" th:href="@{/galeria/editar/{id}(id=${g.id_archivo})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(galerias)}"><td colspan="8" class="text-center">No hay archivos registrados.</td></tr></tbody></table></div><a class="btn btn-default" th:href="@{/proyecto/listar}">Volver</a></div></body></html>
