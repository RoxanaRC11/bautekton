<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de Orden</title><link th:href="@{/lib/bootstrap/css/bootstrap.min.css}" rel="stylesheet"></head><body><div class="container" style="padding-top:30px; max-width:850px"><h2>Detalle de Orden</h2><div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<form th:action="@{/detalleorden/frmdetalleorden}" method="post" th:object="${detalleorden}"><input type="hidden" th:field="*{id_detalleOrden}"><div class="form-group"><label>Descripción</label><input class="form-control" th:field="*{descripcion}" required></div><div class="row"><div class="col-md-6"><div class="form-group"><label>Estatus</label><input class="form-control" th:field="*{estatus}"></div></div><div class="col-md-6"><div class="form-group"><label>Tipo</label><input class="form-control" th:field="*{tipo}"></div></div></div><div class="row"><div class="col-md-6"><div class="form-group"><label>Fecha inicio</label><input type="date" class="form-control" th:field="*{fechaInicio}"></div></div><div class="col-md-6"><div class="form-group"><label>Fecha entrega</label><input type="date" class="form-control" th:field="*{fechaEntrega}"></div></div></div><div class="form-group"><label>Tarea</label><input class="form-control" th:field="*{tarea}"></div><button class="btn btn-primary" type="submit">Procesar</button> <a class="btn btn-default" th:href="@{/orden/listar}">Volver</a></form></div></body></html>
